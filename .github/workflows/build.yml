name: build
on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: get commit message
        run: |
          GIT_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "GIT_COMMIT_MESSAGE<<EOF" >> $GITHUB_ENV
          echo "$GIT_COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: build
        run: ./gradlew build
        env:
          GIT_COMMIT_HASH: ${{ github.sha }}
          GIT_COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: find mod jar
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar')
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
      - name: capture mod jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jar.outputs.path }}
          archive: false